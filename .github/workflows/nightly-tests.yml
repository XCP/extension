# Runs weekly, not nightly. The file keeps its old name because tests and docs link to it.
name: Weekly Tests

permissions:
  contents: read

on:
  schedule:
    # Weekly (Mondays 2 AM UTC): the fuzz and differential suites don't change between PRs.
    - cron: '0 2 * * 1'
  workflow_dispatch: # Allow manual trigger

jobs:
  # The unit suite never touches the network.
  unit-tests:
    name: Unit Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        timeout-minutes: 15
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npx vitest run src

  # Both steps here call the live counterparty-core API (the fuzz suite includes the wire
  # differential), so they share a job: an API outage fails this job alone and cannot hide a
  # unit or e2e regression.
  live-api:
    name: Compose Oracle and Fuzz Tests
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Asks a live counterparty-core node what it would compose for a matrix of parameters and
      # requires our locally packed message bytes to match exactly. Composed-message verification
      # is byte equality, so a divergence between our packer and core blocks those transaction
      # types outright — this is the check that catches such drift before a release rather than
      # after. Two checks live here: coreOracle asks a node what it would compose for a set of
      # params, and onchainRoundTrip rebuilds real confirmed transactions and requires byte
      # equality with the chain. The second covers types core cannot compose synthetically (a
      # dividend needs an asset with holders, a fairmint needs an open fairminter).
      - name: Run compose oracle against counterparty-core
        timeout-minutes: 5
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          COUNTERPARTY_API_URL: ${{ vars.COUNTERPARTY_API_URL || 'https://api.counterparty.io:4000' }}
        run: npx vitest run src/core/counterparty/pack

      # Runs even when the oracle failed, so an oracle outage cannot hide a fuzz failure.
      - name: Run fuzz tests
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npx vitest run src --config vitest.fuzz.config.ts

  # The same sharded run as PRs, with more retries. One serial invocation of the whole suite
  # needs close to two hours, more than a single job should be given.
  e2e-tests:
    name: E2E Tests (Shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    # See pr-tests.yml: the image tag MUST track the `@playwright/test` version in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    timeout-minutes: 60  # Hard backstop so a stalled setup can't burn the 6h job cap
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build:e2e  # grants the optional Trezor Suite permission up front

      # Extension tests launch Chromium headed so MV3 service workers and extension pages exist.
      - name: Start Xvfb
        run: |
          Xvfb -ac :99 -screen 0 1280x1024x16 &
          sleep 2

      # The shard total here must match the matrix above.
      - name: Run E2E tests (Shard ${{ matrix.shard }}/6)
        timeout-minutes: 45
        run: npx playwright test --shard=${{ matrix.shard }}/6 --workers=1 --retries=3
        env:
          CI: true
          DISPLAY: ':99'

      # The Playwright image does not ship jq, so the stats are read with node. A missing
      # test-results.json means Playwright never got as far as running anything — a config or
      # load error — which the test step's own failure already reports.
      - name: Summarize results
        if: always()
        run: |
          {
            echo "## E2E Results (Shard ${{ matrix.shard }}/6)"
            if [ -f "test-results.json" ]; then
              echo '```json'
              node -e 'console.log(JSON.stringify(require("./test-results.json").stats, null, 2))'
              echo '```'
            else
              echo "No test-results.json was written: Playwright did not run."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: weekly-test-results-${{ github.run_number }}-shard-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
            test-results.json
          retention-days: 30
          if-no-files-found: ignore

  # Opens (or comments on) one tracking issue when any job fails, and closes it after a clean run.
  report:
    name: Report
    runs-on: ubuntu-latest
    needs: [unit-tests, live-api, e2e-tests]
    if: ${{ !cancelled() }}
    permissions:
      issues: write

    steps:
      - name: Open or close the failure issue
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          RESULTS: ${{ toJSON(needs) }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const failed = Object.entries(JSON.parse(process.env.RESULTS))
              .filter(([, job]) => job.result !== 'success')
              .map(([name, job]) => `${name}: ${job.result}`);

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              labels: 'automated,test-failure',
              per_page: 100,
            });
            // Issues opened before the rename say "Nightly".
            const tracking = issues.filter(issue => !issue.pull_request
              && /^(Weekly|Nightly) tests failed/.test(issue.title));

            if (failed.length === 0) {
              for (const issue of tracking) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issue.number,
                  body: `Resolved by successful weekly run ${runUrl}.`,
                });
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: issue.number,
                  state: 'closed',
                  state_reason: 'completed',
                });
              }
              return;
            }

            const detail = failed.map(line => `- ${line}`).join('\n');
            if (tracking.length > 0) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: tracking[0].number,
                body: `Another weekly run failed: ${runUrl}\n\n${detail}`,
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title: `Weekly tests failed - ${new Date().toISOString().split('T')[0]}`,
                body: `The weekly test run failed. See the [workflow run](${runUrl}).\n\n${detail}`,
                labels: ['automated', 'test-failure'],
              });
            }
            core.setFailed(`Failed jobs: ${failed.join(', ')}`);
