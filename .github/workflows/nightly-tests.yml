name: Nightly Tests

permissions:
  contents: read
  issues: write  # For creating failure notification issues

on:
  schedule:
    # Run at 2 AM UTC every day
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  full-test-suite:
    name: Full Test Suite
    runs-on: ubuntu-latest
    # The official Playwright image ships Chromium and every system library it needs, so the
    # browser-install and `install-deps` steps below are gone. `playwright install-deps` ran apt
    # against the runner's Ubuntu mirror on every job and routinely stalled there, timing out
    # 4-6 batches per run; the retry loop could not help, because the whole loop shared one
    # `timeout-minutes` budget that a single stalled attempt exhausted.
    #
    # The tag MUST track the `@playwright/test` version in package.json. The image's browsers are
    # built for that exact release, and Playwright refuses to launch a build it did not expect.
    #
    # The image runs as root, which Chromium normally refuses — the e2e fixtures already pass
    # `--no-sandbox` and `--disable-dev-shm-usage`, so no user remapping is needed.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 120  # Hard backstop so a stalled setup can't burn the 6h job cap

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build extension
        run: npm run build
      
      - name: Run TypeScript type checking
        run: npm run compile
        continue-on-error: true
      
      - name: Run unit tests
        timeout-minutes: 15
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npx vitest run src

      # Asks a live counterparty-core node what it would compose for a matrix of parameters and
      # requires our locally packed message bytes to match exactly. Composed-message verification is
      # byte equality, so a divergence between our packer and core blocks those transaction types
      # outright — this is the check that catches such drift before a release rather than after.
      # Nightly rather than per-PR because it depends on a third-party endpoint being reachable.
      # Two checks live here: coreOracle asks a node what it would compose for a set of params, and
      # onchainRoundTrip rebuilds real confirmed transactions and requires byte equality with the
      # chain. The second covers types core cannot compose synthetically (a dividend needs an asset
      # with holders, a fairmint needs an open fairminter).
      - name: Run compose oracle against counterparty-core
        timeout-minutes: 5
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          COUNTERPARTY_API_URL: ${{ vars.COUNTERPARTY_API_URL || 'https://api.counterparty.io:4000' }}
        run: npx vitest run src/core/counterparty/pack

      - name: Run fuzz tests
        timeout-minutes: 15
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npx vitest run src --config vitest.fuzz.config.ts
      
      - name: Run all E2E tests
        timeout-minutes: 60
        run: npx playwright test --retries=3 --workers=1
        continue-on-error: true
      
      - name: Generate test report
        if: always()
        run: |
          echo "# Nightly Test Report" >> $GITHUB_STEP_SUMMARY
          echo "Date: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "test-results.json" ]; then
            echo "## Test Results" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat test-results.json | jq '.stats' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
      
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nightly-test-results-${{ github.run_number }}
          path: |
            test-results/
            playwright-report/
          retention-days: 30
      
      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            await github.rest.issues.create({
              owner,
              repo,
              title: `Nightly tests failed - ${new Date().toISOString().split('T')[0]}`,
              body: `The nightly test run failed. Please check the [workflow run](${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}) for details.`,
              labels: ['automated', 'test-failure']
            });
