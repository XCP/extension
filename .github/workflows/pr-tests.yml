name: PR Tests

permissions:
  contents: read

# Minutes are billed, so this runs once per PR head and not again on merge: main only ever
# receives squashes of PRs that passed here. A newer push to the same PR cancels the older run.
on:
  pull_request:
    branches: [ main, develop ]
    types: [ opened, synchronize, reopened, ready_for_review ]
  workflow_dispatch:

concurrency:
  group: pr-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-pinned-dependencies:
    name: Check Pinned Dependencies
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.changes.outputs.code }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # A PR that only touches docs skips the unit and e2e suites. Anything else, or no PR base
      # (a manual run), runs everything.
      - name: Detect code changes
        id: changes
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(git diff --name-only "$base" "${{ github.sha }}")
          echo "$files"
          if echo "$files" | grep -qvE '(\.md$|^docs/|^LICENSE$)'; then code=true; else code=false; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Check for unpinned dependencies
        run: |
          # Check both dependencies and devDependencies for unpinned versions
          # Unpinned = contains ^, ~, >, <, =, *, x, or "latest"
          # Note: caret must be at end of character class in jq regex

          unpinned=$(jq -r '
            (.dependencies // {}) + (.devDependencies // {})
            | to_entries[]
            | select(.value | test("[~><=*x^]|latest"))
            | "\(.key): \(.value)"
          ' package.json)

          if [ -n "$unpinned" ]; then
            echo "❌ Found unpinned dependencies in package.json:"
            echo "$unpinned"
            echo ""
            echo "All dependencies must use exact versions (e.g., \"1.2.3\" not \"^1.2.3\")"
            exit 1
          fi

          echo "✅ All dependencies are pinned to exact versions"

  lint-and-type-check:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    needs: check-pinned-dependencies

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type checking
        run: npm run compile

      - name: Lint
        run: npm run lint

      - name: Build extension
        run: npm run build

  unit-tests:
    name: Unit Tests (Shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: [check-pinned-dependencies, lint-and-type-check]
    if: needs.check-pinned-dependencies.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Each job pays for install and build, and a shard ran ~1 minute of tests, so two is enough.
        shard: [1, 2]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Run unit tests (Shard ${{ matrix.shard }}/10)
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npx vitest run src --shard=${{ matrix.shard }}/2

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-results-shard-${{ matrix.shard }}
          path: test-results.json
          if-no-files-found: ignore

  e2e-tests:
    name: E2E Tests (Batch ${{ matrix.batch }})
    runs-on: ubuntu-latest
    # The official Playwright image ships Chromium and every system library it needs, so the
    # browser-install and `install-deps` steps below are gone. `playwright install-deps` ran apt
    # against the runner's Ubuntu mirror on every job and routinely stalled there, timing out
    # 4-6 batches per run; the retry loop could not help, because the whole loop shared one
    # `timeout-minutes` budget that a single stalled attempt exhausted.
    #
    # The tag MUST track the `@playwright/test` version in package.json. The image's browsers are
    # built for that exact release, and Playwright refuses to launch a build it did not expect.
    #
    # The image runs as root, which Chromium normally refuses — the e2e fixtures already pass
    # `--no-sandbox` and `--disable-dev-shm-usage`, so no user remapping is needed.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    timeout-minutes: 45  # Hard backstop so a stalled setup can't burn the 6h job cap
    needs: [check-pinned-dependencies, lint-and-type-check]
    # Drafts are still being written; the suite runs once they are marked ready.
    if: github.event.pull_request.draft != true && needs.check-pinned-dependencies.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Five batches: each job spends ~3 minutes on container, install and build before any
        # test runs, so twenty batches spent more on setup than on tests.
        batch: [1, 2, 3, 4, 5]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build:e2e  # grants the optional Trezor Suite permission up front

      - name: Configure Xvfb (MetaMask style)
        run: |
          # Start Xvfb in the background with MetaMask's exact configuration
          Xvfb -ac :99 -screen 0 1280x1024x16 &
          # Give it a moment to start
          sleep 2

      - name: Run E2E tests (Batch ${{ matrix.batch }})
        timeout-minutes: 35  # Set a reasonable timeout per batch
        run: |
          # Dynamically discover all test files and distribute them across batches
          TOTAL_BATCHES=5
          CURRENT_BATCH=${{ matrix.batch }}

          # Get all test files, sorted for consistency
          ALL_FILES=$(find e2e -name "*.spec.ts" -type f | sort)

          # Count total files
          TOTAL_FILES=$(echo "$ALL_FILES" | wc -l)
          FILES_PER_BATCH=$(( (TOTAL_FILES + TOTAL_BATCHES - 1) / TOTAL_BATCHES ))
          START_LINE=$(( (CURRENT_BATCH - 1) * FILES_PER_BATCH + 1 ))
          END_LINE=$(( START_LINE + FILES_PER_BATCH - 1 ))

          # Get files for this batch using sed
          BATCH_FILES=$(echo "$ALL_FILES" | sed -n "${START_LINE},${END_LINE}p" | tr '\n' ' ')

          # Run tests for this batch
          if [ -n "$BATCH_FILES" ]; then
            echo "Running tests for batch $CURRENT_BATCH (lines $START_LINE-$END_LINE of $TOTAL_FILES):"
            echo "$BATCH_FILES"
            npx playwright test $BATCH_FILES --workers=1 --retries=1
          else
            echo "No tests to run for batch $CURRENT_BATCH"
          fi
        env:
          CI: true
          DISPLAY: ':99'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-test-results-batch-${{ matrix.batch }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-batch-${{ matrix.batch }}
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # Combined status for branch protection (reports as "Unit Tests")
  unit-tests-status:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [check-pinned-dependencies, unit-tests]
    if: always()

    steps:
      - name: Check unit test results
        run: |
          # A docs-only PR skips the unit suite.
          if [ "${{ needs.check-pinned-dependencies.outputs.code }}" = "false" ] && [ "${{ needs.unit-tests.result }}" = "skipped" ]; then
            echo "Docs-only change; unit tests not needed"
            exit 0
          fi
          if [ "${{ needs.unit-tests.result }}" != "success" ]; then
            echo "Unit tests failed!"
            exit 1
          fi
          echo "All unit tests passed!"

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [check-pinned-dependencies, unit-tests, e2e-tests]
    if: always()

    steps:
      - name: Check test results
        run: |
          UNIT="${{ needs.unit-tests.result }}"
          E2E="${{ needs.e2e-tests.result }}"
          # A docs-only PR skips both suites.
          if [ "${{ needs.check-pinned-dependencies.outputs.code }}" = "false" ]; then
            [ "$UNIT" = "skipped" ] && UNIT=success
            [ "$E2E" = "skipped" ] && E2E=success
          fi
          # A draft skips the e2e suite; it runs, and must pass, once the PR is ready.
          if [ "$E2E" = "skipped" ] && [ "${{ github.event.pull_request.draft }}" = "true" ]; then E2E=success; fi
          if [ "$UNIT" != "success" ] || [ "$E2E" != "success" ]; then
            echo "Tests failed!"
            exit 1
          fi
          echo "All tests passed!"

  security-check:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: |
          # Only audit production dependencies (not devDependencies)
          # Trezor testing packages have known vulnerabilities in transitive deps we can't fix
          npm audit --omit=dev --audit-level=high
        continue-on-error: true  # Don't fail on low/medium vulnerabilities

      - name: Check for known vulnerabilities
        run: |
          # Production dependencies must be clean at high/critical. The @trezor/* exemption for
          # the elliptic chain (GHSA-848j-6mx2-7j84) ended with Connect 10, which dropped it.
          # Fixable transitive advisories must be resolved rather than allowlisted.
          audit_output=$(npm audit --omit=dev --json 2>/dev/null || true)
          real=$(echo "$audit_output" | jq '
            [.vulnerabilities | to_entries[]
             | select(.value.severity == "high" or .value.severity == "critical")] | length')

          if [ "$real" -gt 0 ]; then
            echo "Found $real high/critical vulnerabilities:"
            echo "$audit_output" | jq -r '
              .vulnerabilities | to_entries[]
              | select(.value.severity == "high" or .value.severity == "critical")
              | "\(.key): \(.value.severity)"'
            exit 1
          fi
          echo "No high/critical vulnerabilities."
