name: PR Tests

permissions:
  contents: read

# Minutes are billed, so this runs once per PR head and not again on merge: main only ever
# receives squashes of PRs that passed here. A newer push to the same PR cancels the older run.
on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, ready_for_review ]
  workflow_dispatch:

concurrency:
  group: pr-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-pinned-dependencies:
    name: Check Pinned Dependencies
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.changes.outputs.code }}

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      # A PR that only touches docs skips the unit and e2e suites. Anything else, or no PR base
      # (a manual run), runs everything.
      - name: Detect code changes
        id: changes
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(git diff --name-only "$base" "${{ github.sha }}")
          echo "$files"
          if echo "$files" | grep -qvE '(\.md$|^docs/|^LICENSE$)'; then code=true; else code=false; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Check for unpinned dependencies
        run: |
          # Check both dependencies and devDependencies for unpinned versions
          # Unpinned = contains ^, ~, >, <, =, *, x, or "latest"
          # Note: caret must be at end of character class in jq regex

          unpinned=$(jq -r '
            (.dependencies // {}) + (.devDependencies // {})
            | to_entries[]
            | select(.value | test("[~><=*x^]|latest"))
            | "\(.key): \(.value)"
          ' package.json)

          if [ -n "$unpinned" ]; then
            echo "❌ Found unpinned dependencies in package.json:"
            echo "$unpinned"
            echo ""
            echo "All dependencies must use exact versions (e.g., \"1.2.3\" not \"^1.2.3\")"
            exit 1
          fi

          echo "✅ All dependencies are pinned to exact versions"

  lint-and-type-check:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    needs: check-pinned-dependencies

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type checking
        run: npm run compile

      # With CI set, scripts/lint.mjs also fails when lint-baseline.json allows more warnings than
      # remain, so the budget cannot keep slack a later change could spend.
      - name: Lint
        run: npm run lint

      - name: Build extension
        run: npm run build

  unit-tests:
    name: Unit Tests (Shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [check-pinned-dependencies, lint-and-type-check]
    if: needs.check-pinned-dependencies.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Each job pays for install, and a shard ran ~1 minute of tests, so two is enough.
        shard: [1, 2]

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # `npm ci` runs `wxt prepare`, which is all the unit suite needs; no test reads .output.
      - name: Install dependencies
        run: npm ci

      - name: Run unit tests (Shard ${{ matrix.shard }}/2)
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npx vitest run src --shard=${{ matrix.shard }}/2

  e2e-tests:
    name: E2E Tests (Shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    # The official Playwright image ships Chromium and every system library it needs, so there is
    # no browser-install or `install-deps` step. `playwright install-deps` ran apt against the
    # runner's Ubuntu mirror on every job and routinely stalled there.
    #
    # The tag MUST track the `@playwright/test` version in package.json. The image's browsers are
    # built for that exact release, and Playwright refuses to launch a build it did not expect.
    #
    # The image runs as root, which Chromium normally refuses — the e2e fixtures already pass
    # `--no-sandbox` and `--disable-dev-shm-usage`, so no user remapping is needed.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    timeout-minutes: 60  # Hard backstop so a stalled setup can't burn the 6h job cap
    needs: [check-pinned-dependencies, lint-and-type-check]
    # Drafts are still being written; the suite runs once they are marked ready.
    if: github.event.pull_request.draft != true && needs.check-pinned-dependencies.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        # The whole suite is ~110 minutes serial with one retry. Six shards keep each around
        # 20 minutes, well inside the step limit, while each job still spends ~3 minutes on
        # container, install and build before any test runs.
        shard: [1, 2, 3, 4, 5, 6]

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build:e2e  # grants the optional Trezor Suite permission up front

      # Extension tests launch Chromium headed so MV3 service workers and extension pages exist.
      - name: Start Xvfb
        run: |
          Xvfb -ac :99 -screen 0 1280x1024x16 &
          sleep 2

      # Playwright's own sharding splits by test count (whole files, since the config is not
      # fullyParallel), where the old split by file count gave the first batch the heaviest specs.
      # The shard total here must match the matrix above.
      - name: Run E2E tests (Shard ${{ matrix.shard }}/6)
        timeout-minutes: 45
        run: npx playwright test --shard=${{ matrix.shard }}/6 --workers=1 --retries=1
        env:
          CI: true
          DISPLAY: ':99'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-test-results-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # Combined status for branch protection (reports as "Unit Tests")
  unit-tests-status:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [check-pinned-dependencies, unit-tests]
    if: always()

    steps:
      - name: Check unit test results
        run: |
          # A docs-only PR skips the unit suite.
          if [ "${{ needs.check-pinned-dependencies.outputs.code }}" = "false" ] && [ "${{ needs.unit-tests.result }}" = "skipped" ]; then
            echo "Docs-only change; unit tests not needed"
            exit 0
          fi
          if [ "${{ needs.unit-tests.result }}" != "success" ]; then
            echo "Unit tests failed!"
            exit 1
          fi
          echo "All unit tests passed!"

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [check-pinned-dependencies, unit-tests, e2e-tests]
    if: always()

    steps:
      - name: Check test results
        run: |
          UNIT="${{ needs.unit-tests.result }}"
          E2E="${{ needs.e2e-tests.result }}"
          # A docs-only PR skips both suites.
          if [ "${{ needs.check-pinned-dependencies.outputs.code }}" = "false" ]; then
            [ "$UNIT" = "skipped" ] && UNIT=success
            [ "$E2E" = "skipped" ] && E2E=success
          fi
          # A draft skips the e2e suite; it runs, and must pass, once the PR is ready.
          if [ "$E2E" = "skipped" ] && [ "${{ github.event.pull_request.draft }}" = "true" ]; then E2E=success; fi
          if [ "$UNIT" != "success" ] || [ "$E2E" != "success" ]; then
            echo "Tests failed!"
            exit 1
          fi
          echo "All tests passed!"

  security-check:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: '.nvmrc'

      # npm audit reads package-lock.json alone, so there is nothing to install.
      - name: Audit production dependencies
        run: |
          # Production dependencies must be clean at high/critical. The @trezor/* exemption for
          # the elliptic chain (GHSA-848j-6mx2-7j84) ended with Connect 10, which dropped it.
          # Fixable transitive advisories must be resolved rather than allowlisted.
          audit_output=$(npm audit --omit=dev --json 2>/dev/null || true)
          real=$(echo "$audit_output" | jq '
            [.vulnerabilities | to_entries[]
             | select(.value.severity == "high" or .value.severity == "critical")] | length')

          if [ "$real" -gt 0 ]; then
            echo "Found $real high/critical vulnerabilities:"
            echo "$audit_output" | jq -r '
              .vulnerabilities | to_entries[]
              | select(.value.severity == "high" or .value.severity == "critical")
              | "\(.key): \(.value.severity)"'
            exit 1
          fi
          echo "No high/critical vulnerabilities."
