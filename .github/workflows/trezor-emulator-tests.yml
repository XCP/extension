name: Trezor Emulator Tests

permissions:
  contents: read

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'src/core/hardware/**'
      - 'src/core/bitcoin/**'
      - 'src/pages/keychain/wallets/connect-hardware.tsx'
      - 'src/platform/suiteAccess.ts'
      - 'src/platform/suiteOrigins.ts'
      - 'src/platform/walletManager.ts'
      - 'src/components/domain/wallet/trezor-access-notice.tsx'
      - 'wxt.config.ts'
      - 'vitest.config.ts'
      - 'vitest.setup.ts'
      - 'playwright.config.ts'
      - 'e2e/hardware/**'
      - 'e2e/helpers/trezor-emulator.ts'
      - 'docker-compose.trezor.yml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/trezor-emulator-tests.yml'
  workflow_dispatch:

# A newer push to the same PR cancels the older run.
concurrency:
  group: trezor-emulator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  trezor-emulator-tests:
    name: Trezor Emulator Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45  # Hard backstop so a stalled setup can't burn the 6h job cap

    # Use the same Docker service configuration as Trezor's own tests
    # Reference: https://github.com/trezor/connect/blob/develop/.github/workflows/test_with_trezor-user-env.yml
    services:
      trezor-user-env:
        image: ghcr.io/trezor/trezor-user-env@sha256:f1a45f0eb212f47f8facffb8489c9dcacb71236d39175dfc2cecf7f7e859b952
        ports:
          - 9001:9001
          - 21325:21328
        env:
          SDL_VIDEODRIVER: dummy
          USE_TX_CACHE: 'true'
          USE_WS_CACHE: 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install xvfb for headless display
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Wait for WebSocket controller
        timeout-minutes: 2
        run: |
          echo "Waiting for WebSocket controller on port 9001..."
          for i in $(seq 1 40); do
            if nc -z localhost 9001 2>/dev/null; then
              echo "Controller is ready!"
              exit 0
            fi
            echo "Attempt $i/40: Waiting..."
            sleep 3
          done
          echo "Controller failed to start"
          exit 1

      - name: Initialize Trezor emulator
        timeout-minutes: 2
        run: |
          echo "Starting emulator and bridge via WebSocket API..."
          node e2e/hardware/init-trezor-emulator.js

          # Wait for bridge to be ready and verify
          echo ""
          echo "Waiting for bridge to be ready..."
          for i in $(seq 1 30); do
            if curl -s -X POST http://localhost:21325/enumerate > /dev/null 2>&1; then
              echo "Bridge is responding!"
              curl -s -X POST http://localhost:21325/enumerate 2>&1 | head -50
              exit 0
            fi
            echo "Attempt $i/30: Bridge not ready yet..."
            sleep 2
          done
          echo "Bridge failed to start"
          exit 1

      - name: Build extension
        run: npm run build:e2e  # grants the optional Trezor Suite permission up front

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 16
        run: |
          # The browser download can stall on the CDN; cap each attempt and retry
          # so a stall fails in minutes instead of hanging to the job timeout.
          for attempt in 1 2 3; do
            echo "Installing Playwright Chromium (attempt $attempt)..."
            if timeout 300 npx playwright install chromium; then
              exit 0
            fi
            echo "Attempt $attempt stalled or failed; retrying."
            sleep 5
          done
          echo "Playwright browser install failed after 3 attempts" >&2
          exit 1

      - name: Verify bridge before tests
        run: |
          echo "Checking bridge availability before tests..."
          echo ""
          echo "1. Checking if bridge is responding..."
          if curl -s -X POST http://localhost:21325/enumerate > /dev/null 2>&1; then
            echo "   ✓ Bridge is responding"
          else
            echo "   ✗ Bridge NOT responding"
            echo "   Checking what's listening on port 21325..."
            netstat -tlnp 2>/dev/null || ss -tlnp 2>/dev/null || echo "   Cannot check ports"
            echo ""
            echo "   Checking container status..."
            docker ps 2>/dev/null || echo "   Cannot check containers"
          fi
          echo ""
          echo "2. Enumerating devices..."
          DEVICES=$(curl -s -X POST http://localhost:21325/enumerate 2>&1) || DEVICES="Failed to enumerate"
          echo "   $DEVICES"
          echo ""
          echo "3. Checking emulator WebSocket controller listener..."
          if nc -z localhost 9001 2>/dev/null; then
            echo "   ✓ Emulator WebSocket controller is listening"
          else
            echo "   ✗ Emulator WebSocket controller is NOT listening"
          fi
          echo ""

      - name: Run Node.js Integration Tests (TrezorConnect direct)
        id: node-tests
        timeout-minutes: 10
        env:
          TREZOR_EMULATOR_URL: ws://localhost:9001
          TREZOR_BRIDGE_URL: http://localhost:21325
          TREZOR_EMULATOR_AVAILABLE: '1'
          NODE_OPTIONS: --max-old-space-size=4096
        continue-on-error: true
        run: npm run test:emulator

      - name: Run Trezor UI E2E tests
        id: ui-tests
        timeout-minutes: 15
        env:
          TREZOR_EMULATOR_URL: ws://localhost:9001
          TREZOR_BRIDGE_URL: http://localhost:21325
          TREZOR_EMULATOR_AVAILABLE: '1'
          NODE_OPTIONS: --max-old-space-size=4096
          CI: 'true'
        continue-on-error: true
        run: xvfb-run npx playwright test e2e/hardware/trezor.spec.ts --reporter=list

      - name: Check test results
        if: always()
        run: |
          echo "=== Trezor E2E Test Results Summary ==="
          echo "Node.js Integration Tests: ${{ steps.node-tests.outcome }}"
          echo "UI Tests: ${{ steps.ui-tests.outcome }}"
          echo ""

          # Both are required. With Connect 10 the extension reaches a device only through
          # Suite, so the device path is proved by the Node.js suite against the emulator and
          # the Suite handshake by e2e/tests/trezor-connect-v10.spec.ts in the PR workflow.
          REQUIRED_FAILURES=0
          if [ "${{ steps.node-tests.outcome }}" == "failure" ]; then
            echo "❌ Node.js Integration tests failed (REQUIRED)"
            REQUIRED_FAILURES=$((REQUIRED_FAILURES + 1))
          fi
          if [ "${{ steps.ui-tests.outcome }}" == "failure" ]; then
            echo "❌ UI tests failed (REQUIRED)"
            REQUIRED_FAILURES=$((REQUIRED_FAILURES + 1))
          fi
          if [ $REQUIRED_FAILURES -gt 0 ]; then
            echo "❌ $REQUIRED_FAILURES required test suite(s) failed"
            exit 1
          fi
          echo "✅ All required test suites passed"

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: trezor-playwright-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
